<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Página não encontrada | NovaSync</title>
  <style>
    :root { --bg: oklch(0.10 0.025 300); --fg: oklch(0.97 0.012 300); --muted: oklch(0.75 0.030 300); --border: oklch(0.36 0.045 300); --accent: #2a2a46; --readable: oklch(0.82 0.08 260); }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; background: var(--bg); color: var(--fg); font: 16px/1.6 Manrope, ui-sans-serif, system-ui, sans-serif; }
    main { width: min(620px, 100%); padding: clamp(32px, 8vw, 72px); border: 1px solid var(--border); border-radius: 10px; text-align: center; }
    .code { margin: 0; color: var(--readable); font: 12px/1.4 "SF Mono", ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 16px 0 12px; font-size: clamp(38px, 8vw, 68px); line-height: 1; letter-spacing: -.06em; }
    p { margin: 0 auto 28px; max-width: 460px; color: var(--muted); }
    a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: 0 20px; border: 1px solid var(--border); border-radius: 8px; background: var(--accent); color: var(--fg); text-decoration: none; font-weight: 700; }
    a:hover, a:focus-visible { border-color: var(--fg); }
    a:focus-visible { outline: 3px solid var(--readable); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="code">Erro 404</p>
    <h1>Página não encontrada</h1>
    <p>O endereço pode ter sido alterado ou não existe mais. Volte para a página inicial para continuar.</p>
    <a href="index.html">Ir para a página inicial</a>
  </main>
</body>
</html>
