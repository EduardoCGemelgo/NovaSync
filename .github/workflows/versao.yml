# Depois de cada push na Site, carimba ?v=<hash> nos .js e .css das páginas (.github/versao.py)
# e commita se algo mudou. O commit do bot não dispara este workflow de novo (GITHUB_TOKEN).
name: Versão dos arquivos

on:
  push:
    branches: [Site]
    paths: ["**.html", "**.js", "**.css"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: versao
  cancel-in-progress: false

jobs:
  carimbar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/versao.py
      - name: Commita se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then echo "sem mudança"; exit 0; fi
          git commit -m "versão: carimbo dos arquivos js e css"
          git push
